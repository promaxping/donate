<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mời tôi một ly cà phê ☕</title>
  <style>
    body {
      background: radial-gradient(circle at top, #1e1e2f, #0e0e14);
      font-family: 'Inter', sans-serif;
      color: #fff;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      padding: 20px;
    }

    .card {
      background: rgba(25, 25, 40, 0.9);
      border-radius: 20px;
      padding: 40px 25px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
      max-width: 380px;
      margin: auto;
      position: relative;
      overflow: visible;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-top: 10px;
      border: 3px solid #1e1e2f;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
    }
    .avatar:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    h1 {
      margin-top: 15px;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .desc {
      font-size: 0.9rem;
      color: #aaa;
    }

    .invite {
      margin-top: 20px;
      color: #ffd85e;
    }

    .qr-section {
      margin-top: 20px;
    }

    .qr {
      width: 230px;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .qr:hover {
      transform: scale(1.03);
      opacity: 0.9;
    }

    .bank {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #bbb;
    }

    .links {
      margin-top: 25px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .links a {
      text-decoration: none;
      color: white;
      background: #29294b;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 500;
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }
    .links a:hover {
      background: linear-gradient(90deg, #6a00ff, #c800ff);
      box-shadow: 0 0 10px #6a00ff;
    }

    .thanks {
      margin-top: 25px;
      color: #c9a6ff;
      font-size: 0.9rem;
    }

    /* Popup */
    .popup {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    .popup.show {
      display: flex;
    }
    .popup-img {
      width: 85%;
      max-width: 380px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255,255,255,0.3);
    }
    .close {
      position: absolute;
      top: 30px;
      right: 40px;
      font-size: 2rem;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    .close:hover {
      color: #ff9a9a;
    }

    /* Mobile optimization */
    @media (max-width: 600px) {
      .avatar {
        width: 100px;
        height: 100px;
        margin-top: 20px;
      }
      .qr {
        width: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <img src="img/avatar.jpg" alt="Nguyễn Bảo Ngọc" class="avatar" />

      <h1>Nguyễn Bảo Ngọc</h1>
      <p class="desc">Một người yêu sáng tạo và công nghệ.</p>

      <h2 class="invite">Mời tôi một ly cà phê ☕</h2>

      <div class="qr-section">
        <img src="img/qr.jpg" alt="QR TPBank" class="qr" id="qrImage" />
      </div>

      <p class="bank">TPBank • <b>NGUYEN BAO NGOC</b> • STK <b>95444444444</b></p>

      <div class="links">
        <a href="https://facebook.com/100000654159726" target="_blank">Facebook</a>
        <a href="https://zalo.me/0352332234" target="_blank">Zalo</a>
        <a href="https://github.com/hichaoban" target="_blank">GitHub</a>
        <a href="https://youtube.com/@LangSuTV" target="_blank">YouTube</a>
        <a href="img/qr.jpg" download>Tải QR</a>
      </div>

      <p class="thanks">Cảm ơn bạn rất nhiều 💜</p>
    </div>
  </div>

  <!-- Popup QR -->
  <div class="popup" id="popup">
    <span class="close" id="closePopup">&times;</span>
    <img src="img/qr.jpg" alt="QR Popup" class="popup-img" />
  </div>

  <script>
    const qr = document.getElementById('qrImage');
    const popup = document.getElementById('popup');
    const close = document.getElementById('closePopup');

    qr.addEventListener('click', () => popup.classList.add('show'));
    close.addEventListener('click', () => popup.classList.remove('show'));
    popup.addEventListener('click', e => {
      if (e.target === popup) popup.classList.remove('show');
    });
  </script>
</body>
</html>
