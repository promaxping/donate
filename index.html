
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mời tôi một ly cà phê ☕ — Nguyễn Bảo Ngọc</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b0b12; --panel:#141428; --text:#eef2ff; --muted:#b8b9d6;
      --accent:#a78bfa; --accent2:#7c3aed; --border:#262748;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:'Nunito',ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color:var(--text); overflow-x:hidden;
      display:flex; align-items:center; justify-content:center; padding:28px;
      background:
        radial-gradient(1200px 700px at -10% -10%, #4c1d95 0%, transparent 55%),
        radial-gradient(1000px 600px at 110% 0%, #7c3aed66 0%, transparent 60%),
        linear-gradient(180deg, var(--bg), #090912);
      animation:bgGlow 16s ease-in-out infinite alternate;
    }
    @keyframes bgGlow{
      0%{filter:saturate(1) brightness(1)}
      100%{filter:saturate(1.1) brightness(1.08)}
    }
    .card{
      width:min(660px,100%); background:var(--panel); border:1px solid var(--border);
      border-radius:20px; padding:26px; text-align:center;
      box-shadow:0 20px 60px #0008, inset 0 1px 0 #ffffff10;
    }
    .avatar{
      width:108px;height:108px;border-radius:50%;object-fit:cover;
      border:2px solid #ffffff22; box-shadow:0 10px 30px #0007; transition:transform .35s ease, filter .35s ease;
      filter:saturate(1);
    }
    .avatar:hover{ transform:scale(1.03); filter:saturate(1.05) contrast(1.02) }
    h1{font-size:1.6rem; margin:14px 0 4px}
    .sub{color:var(--muted); margin:0 0 14px}
    .title{font-size:1.25rem; margin:8px 0 12px; color:#f5d76e; font-weight:800; letter-spacing:.2px}
    .qr-thumb{
      width:min(260px, 90%); border-radius:16px; background:#fff; padding:10px;
      margin:10px auto 6px; cursor:pointer; box-shadow:0 10px 26px #0006; transition:transform .25s ease;
    }
    .qr-thumb:hover{ transform:translateY(-2px) }
    .bank{opacity:.92; margin-bottom:8px}
    .links{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:10px}
    .btn{
      background:#1b1b34; color:var(--text); border:1px solid var(--border);
      text-decoration:none; padding:10px 14px; border-radius:12px; font-weight:700;
      box-shadow:inset 0 0 0 0 #7c3aed; transition:border-color .2s, box-shadow .2s, transform .2s;
    }
    .btn:hover{ border-color:#7c3aed; box-shadow:0 0 0 3px #7c3aed22, 0 8px 24px #7c3aed44; transform:translateY(-1px) }
    .small{font-size:.92rem}
    /* Modal */
    .modal{
      position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:50;
      background:rgba(5,5,10,.6); backdrop-filter:blur(4px);
      animation:fadeIn .2s ease;
    }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .modal.open{ display:flex }
    .modal-card{
      background:#0e0e1a; border:1px solid var(--border); border-radius:18px; padding:14px;
      box-shadow:0 30px 80px #000c; max-width:min(92vw, 520px);
    }
    .modal img{ width:min(480px, 86vw); max-width:100%; background:#fff; border-radius:12px; padding:12px; display:block }
    .modal .meta{ color:var(--muted); margin-top:8px; text-align:center }
    .close{
      position:absolute; top:18px; right:18px; width:38px; height:38px; border-radius:50%;
      display:grid; place-items:center; cursor:pointer; background:#1b1b34; border:1px solid var(--border); color:#fff;
      box-shadow:0 6px 18px #0007;
    }
    .close:hover{ border-color:#7c3aed }
    footer{margin-top:12px; color:#9aa0a6}
  </style>
</head>
<body>
  <main class="card">
    <img src="images/avatar.jpg" alt="Avatar" class="avatar" />
    <h1>Nguyễn Bảo Ngọc</h1>
    <p class="sub">Một người yêu sáng tạo và công nghệ.</p>
    <div class="title">Mời tôi một ly cà phê ☕</div>
    <img class="qr-thumb" src="images/qr_tpbank.png" alt="TPBank VietQR" title="Bấm để phóng to QR" id="qrThumb" />
    <div class="bank">TPBank • <b>NGUYEN BAO NGOC</b> • STK <b>95444444444</b></div>
    <div class="links">
      <a class="btn small" href="https://fb.com/100000654159726" target="_blank" rel="noopener">Facebook</a>
      <a class="btn small" href="https://zalo.me/0352332234" target="_blank" rel="noopener">Zalo</a>
      <a class="btn small" href="https://github.com/hichaoban" target="_blank" rel="noopener">GitHub</a>
      <a class="btn small" href="https://youtube.com/@LangSuTV" target="_blank" rel="noopener">YouTube</a>
      <a class="btn small" href="images/qr_tpbank.png" download>📥 Tải QR</a>
    </div>
    <footer>Cảm ơn bạn rất nhiều 💜</footer>
  </main>

  <!-- Modal QR -->
  <div class="modal" id="qrModal" aria-hidden="true" role="dialog">
    <div class="modal-card">
      <button class="close" id="closeModal" aria-label="Đóng">✕</button>
      <img src="images/qr_tpbank.png" alt="TPBank VietQR lớn" />
      <div class="meta">TPBank • NGUYEN BAO NGOC • 95444444444</div>
    </div>
  </div>

  <script>
    const qrThumb = document.getElementById('qrThumb');
    const modal = document.getElementById('qrModal');
    const closeBtn = document.getElementById('closeModal');

    qrThumb.addEventListener('click', () => {
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
    });
    closeBtn.addEventListener('click', () => {
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
    });
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
      }
    });
  </script>
</body>
</html>
